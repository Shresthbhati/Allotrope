[project]
name = "allotrope"
version = "0.1.0"
description = "AI-driven safe energy management for polar research station microgrids (SIH 2026, PS SIH26061)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "gymnasium>=1.0",
    "opendssdirect.py>=0.9",
]

[project.optional-dependencies]
rl = ["torch>=2.2"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
controlplane = ["grpcio>=1.60", "grpcio-tools>=1.60"]
mqtt = ["paho-mqtt>=2.0"]
deploy = ["paho-mqtt>=2.0", "psycopg[binary]>=3.1"]
optimization = ["pulp>=2.8"]
dev = [
    "pytest>=8.0", "hypothesis>=6.0", "torch>=2.2",
    "fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27",
    "grpcio>=1.60", "grpcio-tools>=1.60",
    "paho-mqtt>=2.0", "psycopg[binary]>=3.1", "amqtt>=0.11",
    "pulp>=2.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["allotrope*"]

[tool.setuptools.package-data]
allotrope = ["config/stations/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
